import {
    Box,
    FormControl,
    TextField,
    Autocomplete,
    Button,
} from &#x27;@mui/material&#x27;
import { AddCircle } from &#x27;@mui/icons-material&#x27;
import { createFilterOptions } from &#x27;@mui/material/Autocomplete&#x27;
import { FormattedMessage, useIntl } from &#x27;react-intl&#x27;
import { Client } from &#x27;@/components/clients/types&#x27;
import Overflow from &#x27;@/components/common/Overflow/Overflow&#x27;
import { ClientsSelectProps } from &#x27;../types&#x27;
import { AddClient } from &#x27;@/components/clients/components/AddClient/AddClient&#x27;

const filter = createFilterOptions&lt;Client&gt;()

const ClientsSelectView = ({
    clients,
    setClients,
    allClients,
    sx,
}: ClientsSelectProps) =&gt; {
    const intl = useIntl()
    const [openAddClient, setOpenAddClient] = useState&lt;boolean | string&gt;(false)
    return (
        &lt;&gt;
            &lt;FormControl fullWidth variant=&quot;outlined&quot;&gt;
                &lt;Autocomplete
                    id=&quot;clients&quot;
                    sx={sx}
                    multiple
                    options={allClients as Client[]}
                    value={allClients.filter((c) =&gt;
                        clients?.find((cl) =&gt; cl === c.key)
                    )}
                    getOptionLabel={(option) =&gt; option.name || &#x27;&#x27;}
                    onChange={(_, values) =&gt; {
                        setClients(values.map((d) =&gt; d.key))
                    }}
                    renderOption={(props, option) =&gt; (
                        &lt;li
                            {...props}
                            style={{
                                ...(option.new
                                    ? {
                                          padding: 0,
                                      }
                                    : undefined),
                            }}
                            key={option.key}
                        &gt;
                            {option.new ? (
                                &lt;Box
                                    component=&quot;span&quot;
                                    sx={{
                                        width: &#x27;100%&#x27;,
                                        padding: 1,
                                        paddingLeft: 2,
                                        paddingRight: 2,
                                    }}
                                    onClick={(e) =&gt; {
                                        e.stopPropagation()
                                    }}
                                &gt;
                                    &lt;Button
                                        size=&quot;small&quot;
                                        startIcon={&lt;AddCircle /&gt;}
                                        onClick={(e) =&gt; {
                                            e.stopPropagation()
                                            setOpenAddClient(
                                                option.name || true
                                            )
                                        }}
                                        fullWidth
                                        variant=&quot;outlined&quot;
                                        sx={{
                                            textTransform: &#x27;none&#x27;,
                                        }}
                                    &gt;
                                        &lt;Overflow
                                            text={option.new.toString()}
                                        /&gt;
                                    &lt;/Button&gt;
                                &lt;/Box&gt;
                            ) : (
                                option.name
                            )}
                        &lt;/li&gt;
                    )}
                    filterOptions={(options, params) =&gt; {
                        const filtered = filter(options, params)

                        const { inputValue } = params
                        // Suggest the creation of a new value
                        const isExisting = options.some(
                            (option) =&gt; inputValue === option.name
                        )
                        if (
                            inputValue !== &#x27;&#x27; &amp;&amp;
                            !isExisting &amp;&amp;
                            filtered.length === 0
                        ) {
                            filtered.push({
                                key: &#x27;new&#x27;,
                                name: inputValue,
                                new: intl.formatMessage(
                                    {
                                        id: &#x27;app.Add[Client]&#x27;,
                                    },
                                    {
                                        client: inputValue,
                                    }
                                ),
                                phone: &#x27;&#x27;,
                            })
                        } else {
                            filtered.splice(0, 0, {
                                key: &#x27;new&#x27;,
                                name: &#x27;&#x27;,
                                phone: &#x27;&#x27;,
                                new: intl.formatMessage({
                                    id: &#x27;app.AddClient&#x27;,
                                }),
                            })
                        }

                        return filtered
                    }}
                    renderInput={(params) =&gt; (
                        &lt;TextField
                            {...params}
                            label={&lt;FormattedMessage id=&quot;app.Clients&quot; /&gt;}
                        /&gt;
                    )}
                /&gt;
            &lt;/FormControl&gt;
            &lt;AddClient
                open={openAddClient}
                setOpen={setOpenAddClient}
                onSave={(clientId) =&gt;
                    setClients(
                        Array.isArray(clients)
                            ? [...clients, clientId]
                            : [clientId]
                    )
                }
            /&gt;
        &lt;/&gt;
    )
}

export default ClientsSelectView
