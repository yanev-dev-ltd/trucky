                            isOpen={Boolean(confirmDeleteFile)}
                            message={
                                &lt;FormattedMessage
                                    id=&quot;app.DeleteFileConfirm&quot;
                                    values={{
                                        file: (
                                            &lt;Overflow
                                                text={
                                                    confirmDeleteFile?.name ||
                                                    &#x27;&#x27;
                                                }
                                            /&gt;
                                        ),
                                    }}
                                /&gt;
                            }
                            type=&quot;warn&quot;
                            submit={&lt;FormattedMessage id=&quot;app.Delete&quot; /&gt;}
                            cancel={&lt;FormattedMessage id=&quot;app.Cancel&quot; /&gt;}
                        /&gt;
                        {(!files || files.length === 0) &amp;&amp; (
                            &lt;Box display=&quot;flex&quot; justifyContent=&quot;center&quot; mb={2}&gt;
                                &lt;Typography&gt;
                                    &lt;FormattedMessage id=&quot;app.NoDocuments&quot; /&gt;
                                &lt;/Typography&gt;
                            &lt;/Box&gt;
                        )}
                    &lt;/Paper&gt;
                    &lt;Paper sx={sx.paper}&gt;
                        {edit !== &#x27;notes&#x27; &amp;&amp; (
                            &lt;&gt;
                                &lt;Tooltip
                                    title={&lt;FormattedMessage id=&quot;app.Edit&quot; /&gt;}
                                &gt;
                                    &lt;IconButton
                                        size=&quot;small&quot;
                                        sx={sx.edit}
                                        onClick={() =&gt; {
                                            router.push(
                                                `/clients/${client?.key}/notes`
                                            )
                                            reset()
                                        }}
                                    &gt;
                                        &lt;Edit /&gt;
                                    &lt;/IconButton&gt;
                                &lt;/Tooltip&gt;
                                &lt;Typography&gt;
                                    &lt;FormattedMessage id=&quot;app.Notes&quot; /&gt;
                                &lt;/Typography&gt;
                                {client.notes &amp;&amp; (
                                    &lt;Box sx={sx.fixedHeight}&gt;
                                        &lt;Typography
                                            sx={{
                                                whiteSpace: &#x27;pre-line&#x27;,
                                                wordBreak: &#x27;break-all&#x27;,
                                                fontSize: 14,
                                            }}
                                            mt={2}
                                        &gt;
                                            {client.notes}
                                        &lt;/Typography&gt;
                                    &lt;/Box&gt;
                                )}
                                {!client.notes &amp;&amp; (
                                    &lt;Box
                                        display=&quot;flex&quot;
                                        justifyContent=&quot;center&quot;
                                        mb={2}
                                    &gt;
                                        &lt;Typography&gt;
                                            &lt;FormattedMessage id=&quot;app.NoNotes&quot; /&gt;
                                        &lt;/Typography&gt;
                                    &lt;/Box&gt;
                                )}
                            &lt;/&gt;
                        )}
                        {edit === &#x27;notes&#x27; &amp;&amp; (
                            &lt;Box
                                component=&quot;form&quot;
                                onSubmit={(event) =&gt; {
                                    event.preventDefault()
                                    saveClientField(&#x27;notes&#x27;)
                                }}
                            &gt;
                                &lt;Typography mb={2}&gt;
                                    &lt;FormattedMessage id=&quot;app.Notes&quot; /&gt;
                                &lt;/Typography&gt;
                                &lt;Tooltip
                                    title={&lt;FormattedMessage id=&quot;app.Cancel&quot; /&gt;}
                                &gt;
                                    &lt;IconButton
                                        size=&quot;small&quot;
                                        sx={sx.edit}
                                        onClick={() =&gt; {
                                            reset()
                                            router.push(
                                                `/clients/${client?.key}`
                                            )
                                        }}
                                    &gt;
                                        &lt;Close /&gt;
                                    &lt;/IconButton&gt;
                                &lt;/Tooltip&gt;
                                &lt;TextareaAutoSize
                                    value={editedClient?.notes || &#x27;&#x27;}
                                    onChange={(event) =&gt;
                                        setEditedClient({
                                            ...client,
                                            notes: event.target.value,
                                        })
                                    }
                                    maxRows={16}
                                /&gt;
                                &lt;Button color=&quot;primary&quot; type=&quot;submit&quot;&gt;
                                    &lt;FormattedMessage id=&quot;app.Save&quot; /&gt;
                                &lt;/Button&gt;
                            &lt;/Box&gt;
                        )}
                    &lt;/Paper&gt;
                    &lt;Divider /&gt;
                    &lt;LoadingButton
                        sx={sx.warn}
                        onClick={() =&gt; setConfirmDeleteClient(true)}
                        startIcon={&lt;Delete /&gt;}
                        color=&quot;secondary&quot;
                        fullWidth
                    &gt;
                        &lt;FormattedMessage id=&quot;app.DeleteClient&quot; /&gt;
                    &lt;/LoadingButton&gt;
                    &lt;Confirm
                        onCancel={() =&gt; setConfirmDeleteClient(false)}
                        onSubmit={() =&gt; {
                            deleteClient()
                            setConfirmDeleteClient(false)
                        }}
                        isOpen={confirmDeleteClient}
                        message={
                            &lt;FormattedMessage
                                id=&quot;app.Deleting&quot;
                                values={{
                                    name: &lt;Overflow text={client.name || &#x27;&#x27;} /&gt;,
                                }}
                            /&gt;
                        }
                        type=&quot;warn&quot;
                        submit={&lt;FormattedMessage id=&quot;app.Delete&quot; /&gt;}
                        cancel={&lt;FormattedMessage id=&quot;app.Cancel&quot; /&gt;}
                    /&gt;
                &lt;/Box&gt;
            )}
        &lt;/Drawer&gt;
    )
}

export default EditClientView
