import { firestore, auth } from &#x27;@/services/firebase&#x27;
import { updateDoc, doc } from &#x27;firebase/firestore&#x27;
import { useSnackbar } from &#x27;notistack&#x27;
import { useIntl } from &#x27;react-intl&#x27;

const useTheme = () =&gt; {
    const { enqueueSnackbar } = useSnackbar()
    const intl = useIntl()
    const handleChange = useCallback(async (event: ChangeEvent&lt;HTMLInputElement&gt;) =&gt; {
        if (!auth?.currentUser?.uid) return
        try {
            await updateDoc(doc(firestore, &#x27;settings&#x27;, auth.currentUser.uid), { theme: (event.target as HTMLInputElement).value })
            enqueueSnackbar(intl.formatMessage({ id: &#x27;app.Saved.theme&#x27;}), { variant: &#x27;success&#x27; })
        } catch (error) {
            enqueueSnackbar(intl.formatMessage({ id: &#x27;app.Error.saving&#x27;}), { variant: &#x27;error&#x27;, persist: true })
        }
    }, [])

    return { handleChange }
}
