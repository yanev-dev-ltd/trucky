    <div style="margin-top:3em" class="ui container"><h1 class="ui header"><a href="../../../../../../index.html">TypeScript coverage report</a></h1><table style="margin-top:2em" class="ui celled table"><thead class=""><tr class=""><th class="">Filename</th><th class="">Percent</th><th class="">Threshold</th><th class="">Total</th><th class="">Covered</th><th class="">Uncovered</th></tr></thead><tbody class=""><tr class="positive"><td class="">src/components/common/Group/hooks/useGroup.ts</td><td class="">100.00%</td><td class="">80%</td><td class="">196</td><td class="">196</td><td class="">0</td></tr></tbody></table><textarea id="editor" readonly="" style="margin-top:3em">import { useEffect, useState, MouseEvent, useCallback } from &#x27;react&#x27;
import { useGroupProps, GroupType, Group } from &#x27;../types&#x27;
import { useSelector, useDispatch } from &#x27;react-redux&#x27;
import { RootState } from &#x27;@/store/store&#x27;
import { firestore, auth } from &#x27;@/services/firebase&#x27;
import { collection, query, where, onSnapshot, addDoc, updateDoc, doc, deleteDoc } from &#x27;firebase/firestore&#x27;
import { setGroups } from &#x27;../redux&#x27;
import { useIntl } from &#x27;react-intl&#x27;
import { useSnackbar } from &#x27;notistack&#x27;

const useGroup = ({ type }: useGroupProps) =&gt; {
    const intl = useIntl()
    const { enqueueSnackbar } = useSnackbar()
    const groups = useSelector((state: RootState) =&gt; state.groups)
    const [anchorEl, setAnchorEl] = useState&lt;HTMLButtonElement | null&gt;(null)
    const [editGroupIndex, setEditGroupIndex] = useState&lt;number | null&gt;(null)
    const [editedGroup, setEditedGroup] = useState&lt;Group&gt;()
    const [editLoading, setEditLoading] = useState(false)
    const dispatch = useDispatch()

    const handleClose = () =&gt; {
        setAnchorEl(null);
    }
    const handleClick = (event: MouseEvent&lt;HTMLButtonElement&gt;) =&gt; {
        setAnchorEl(event.currentTarget);
    }

    const editGroup = useCallback(async () =&gt; {
        if (!editedGroup?.key || !editedGroup?.type || !editedGroup?.userId || !auth?.currentUser?.uid) return
        setEditLoading(true)
        try {
            await updateDoc(doc(firestore, &#x27;groups&#x27;, editedGroup.key), {
                name: editedGroup.name,
                description: editedGroup.description,
            })
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.Saved.group&#x27;,
            }), { variant: &#x27;success&#x27; })
            setEditedGroup(undefined)
            setEditGroupIndex(null)
        } catch (error) {
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.Error.saving&#x27;,
            }), { variant: &#x27;error&#x27;, persist: true })
        } finally {
            setEditLoading(false)
        }
    }, [editedGroup, auth.currentUser?.uid])

    const deleteGroup = useCallback(async () =&gt; {
        if (!editedGroup?.key || !auth?.currentUser?.uid) return
        try {
            await deleteDoc(doc(firestore, &#x27;groups&#x27;, editedGroup?.key))
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.DeletedGroupSuccess&#x27;,
            }), { variant: &#x27;success&#x27; })
            setEditedGroup(undefined)
            setEditGroupIndex(null)
        } catch (error) {
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.DeletedGroupError&#x27;,
            }), { variant: &#x27;error&#x27;, persist: true })
        }
    }, [editedGroup?.key, auth?.currentUser?.uid])

    useEffect(() =&gt; {
        if (editGroupIndex === null) {
            setEditedGroup(undefined)
            return
        }
        setEditedGroup(groups[editGroupIndex])
    }, [editGroupIndex])

    useEffect(() =&gt; {
        if (!auth.currentUser?.uid) {
            return
        }
        const q = query(collection(firestore, &#x27;groups&#x27;), where(&#x27;userId&#x27;, &#x27;==&#x27;, auth.currentUser?.uid), where(&#x27;type&#x27;, &#x27;==&#x27;, GroupType[type]))
        const unsubscribe = onSnapshot(q, (querySnapshot) =&gt; {
            const groupsList: Group[] = []
            querySnapshot.forEach((doc) =&gt; {
                groupsList.push({...doc.data() as Group, key: doc.id})
            })
            dispatch(setGroups(groupsList))
        })
        return () =&gt; {
            unsubscribe()
        } 
    }, [auth.currentUser?.uid])

    return {
        groups,
        anchorEl,
        handleClick,
        handleClose,
        editGroupIndex,
        setEditGroupIndex,
        editGroup,
        editedGroup,
        setEditedGroup,
        editLoading,
        deleteGroup,
        type,
    }
}

export default useGroup</textarea><pre id="annotations" style="display:none">[]</pre></div>
