export const GroupView = ({
    groups,
    anchorEl,
    handleClose,
    handleClick,
    editGroupIndex,
    setEditGroupIndex,
    editGroup,
    editedGroup,
    setEditedGroup,
    editLoading,
    deleteGroup,
    type,
}: GroupProps) =&gt; {

    const router = useRouter()
    const [confirmDeleteGroup, setConfirmDeleteGroup] = useState&lt;boolean&gt;(false)
    const [openAdd, setOpenAdd] = useState&lt;boolean&gt;(false)
    const selectedGroup = groups.find((g) =&gt; g.key === router.query.group)
    return (
        &lt;Box display=&quot;flex&quot; justifyContent=&quot;center&quot; alignItems=&quot;center&quot; gap={1}&gt;
            &lt;Tooltip title={intl.formatMessage({ id: &#x27;app.Groups&#x27; })}&gt;

                &lt;/IconButton&gt;
            &lt;/Tooltip&gt;

                anchorEl={anchorEl}
                onClose={handleClose}
                anchorOrigin={{

                    horizontal: &#x27;left&#x27;,
                }}
                transformOrigin={{
                    vertical: &#x27;top&#x27;,
                    horizontal: &#x27;left&#x27;,

                        &lt;/ListItem&gt;

                        &gt;

                        &lt;/Button&gt;
                        &lt;AddGroup
                            type={type}
                            open={openAdd}
                            setOpen={setOpenAdd}
                            onSave={() =&gt; setOpenAdd(false)}
                        /&gt;
                    &lt;/ListItem&gt;
                    {groups.map((group, index) =&gt; {
                        if (index === editGroupIndex) {
                            return (
                                &lt;ListItem key={group.key}&gt;
                                    &lt;Paper sx={sx.paper}&gt;
                                        &lt;Box
                                            component=&quot;form&quot;
                                            onSubmit={(event) =&gt; {

                                                event.stopPropagation()
                                                if (!editedGroup?.name) return
                                                editGroup()
                                            }}
                                        &gt;
                                            &lt;Box sx={sx.row}&gt;
                                                &lt;TextField
                                                    variant=&quot;outlined&quot;
                                                    label={

                                                    value={

                                                    onChange={(e) =&gt;
                                                        setEditedGroup({
                                                            ...editedGroup,
                                                            name: e.target
                                                                .value,
                                                        })
                                                    }
                                                /&gt;
                                            &lt;/Box&gt;
                                            &lt;Box sx={sx.row}&gt;
                                                &lt;TextField
                                                    variant=&quot;outlined&quot;
                                                    label={
                                                        &lt;FormattedMessage id=&quot;app.Description&quot; /&gt;
                                                    }
                                                    fullWidth
                                                    value={
                                                        editedGroup?.description ||
                                                        &#x27;&#x27;
                                                    }
                                                    multiline
                                                    onChange={(e) =&gt;
                                                        setEditedGroup({
                                                            ...editedGroup,
                                                            description:
                                                                e.target.value,
                                                        })
                                                    }
                                                /&gt;
                                            &lt;/Box&gt;
                                            &lt;Box
                                                sx={{
                                                    display: &#x27;flex&#x27;,
                                                    justifyContent:
                                                        &#x27;space-between&#x27;,
                                                }}
                                            &gt;
                                                &lt;Button
                                                    variant=&quot;contained&quot;
                                                    color=&quot;error&quot;
                                                    onClick={() =&gt;
                                                        setConfirmDeleteGroup(
                                                            true
                                                        )
                                                    }
                                                &gt;
                                                    &lt;FormattedMessage id=&quot;app.Delete&quot; /&gt;
                                                &lt;/Button&gt;
                                                &lt;Confirm
                                                    onCancel={() =&gt;
                                                        setConfirmDeleteGroup(
                                                            false
                                                        )
                                                    }
                                                    onSubmit={() =&gt; {
                                                        deleteGroup()
                                                        setConfirmDeleteGroup(
                                                            false
                                                        )
                                                    }}
                                                    isOpen={confirmDeleteGroup}
                                                    message={

                                                            values={{
                                                                name: (

                                                    }
                                                /&gt;

                                                    &lt;Button

                                                            setEditGroupIndex(
                                                                null

                                                        }
                                                    &gt;
                                                        &lt;FormattedMessage id=&quot;app.Cancel&quot; /&gt;
                                                    &lt;/Button&gt;
                                                    &lt;LoadingButton
                                                        variant=&quot;contained&quot;
                                                        color=&quot;primary&quot;
                                                        isLoading={editLoading}
                                                        type=&quot;submit&quot;
                                                    &gt;
                                                        &lt;FormattedMessage id=&quot;app.Save&quot; /&gt;
                                                    &lt;/LoadingButton&gt;
                                                &lt;/Box&gt;
                                            &lt;/Box&gt;
                                        &lt;/Box&gt;
                                    &lt;/Paper&gt;
                                &lt;/ListItem&gt;
                            )
                        }
                        return (
                            &lt;ListItem
                                key={group.key}
                                onClick={() =&gt; {
                                    router.replace({
                                        query: {
                                            ...router.query,
                                            group: group.key,
                                        },
                                    })
                                    handleClose()
                                }}
                                secondaryAction={
                                    &lt;IconButton
                                        onClick={(e) =&gt; {
                                            e.stopPropagation()
                                            setEditGroupIndex(index)
                                        }}
                                    &gt;
                                        &lt;Edit /&gt;
                                    &lt;/IconButton&gt;
                                }
                                disablePadding

                                    sx={
                                        selectedGroup?.key === group.key

                                &gt;

                                        primary={group.name}
                                        secondary={group.description}
                                    /&gt;
                                &lt;/ListItemButton&gt;
                            &lt;/ListItem&gt;

                &lt;/List&gt;

                        router.replace({

    )
