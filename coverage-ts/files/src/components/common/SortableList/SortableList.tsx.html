    <div style="margin-top:3em" class="ui container"><h1 class="ui header"><a href="../../../../../index.html">TypeScript coverage report</a></h1><table style="margin-top:2em" class="ui celled table"><thead class=""><tr class=""><th class="">Filename</th><th class="">Percent</th><th class="">Threshold</th><th class="">Total</th><th class="">Covered</th><th class="">Uncovered</th></tr></thead><tbody class=""><tr class="positive"><td class="">src/components/common/SortableList/SortableList.tsx</td><td class="">100.00%</td><td class="">80%</td><td class="">129</td><td class="">129</td><td class="">0</td></tr></tbody></table><textarea id="editor" readonly="" style="margin-top:3em">import React, { useMemo, useState } from &#x27;react&#x27;
import { Location } from &#x27;@/components/routes/types&#x27;
import type { ReactNode } from &#x27;react&#x27;
import {
    DndContext,
    KeyboardSensor,
    PointerSensor,
    useSensor,
    useSensors,
} from &#x27;@dnd-kit/core&#x27;
import type { Active } from &#x27;@dnd-kit/core&#x27;
import {
    SortableContext,
    arrayMove,
    sortableKeyboardCoordinates,
} from &#x27;@dnd-kit/sortable&#x27;

import { DragHandle, SortableItem, SortableOverlay } from &#x27;./components&#x27;

interface Props&lt;T extends Location&gt; {
    items: T[]
    onChange(items: T[]): void
    renderItem(item: T): ReactNode
}

export function SortableList&lt;T extends Location&gt;({
    items,
    onChange,
    renderItem,
}: Props&lt;T&gt;) {
    const [active, setActive] = useState&lt;Active | null&gt;(null)
    const activeItem = useMemo(
        () =&gt; items.find((item) =&gt; item.id === active?.id),
        [active, items]
    )
    const sensors = useSensors(
        useSensor(PointerSensor),
        useSensor(KeyboardSensor, {
            coordinateGetter: sortableKeyboardCoordinates,
        })
    )

    return (
        &lt;DndContext
            sensors={sensors}
            onDragStart={({ active }) =&gt; {
                setActive(active)
            }}
            onDragEnd={({ active, over }) =&gt; {
                if (over &amp;&amp; active.id !== over?.id) {
                    const activeIndex = items.findIndex(
                        ({ id }) =&gt; id === active.id
                    )
                    const overIndex = items.findIndex(
                        ({ id }) =&gt; id === over.id
                    )

                    onChange(arrayMove(items, activeIndex, overIndex))
                }
                setActive(null)
            }}
            onDragCancel={() =&gt; {
                setActive(null)
            }}
        &gt;
            &lt;SortableContext items={items.map((i) =&gt; i.id || &#x27;&#x27;)}&gt;
                {items.map((item) =&gt; (
                    &lt;React.Fragment key={item.id}&gt;
                        {renderItem(item)}
                    &lt;/React.Fragment&gt;
                ))}
            &lt;/SortableContext&gt;
            &lt;SortableOverlay&gt;
                {activeItem ? renderItem(activeItem) : null}
            &lt;/SortableOverlay&gt;
        &lt;/DndContext&gt;
    )
}

SortableList.Item = SortableItem
SortableList.DragHandle = DragHandle
