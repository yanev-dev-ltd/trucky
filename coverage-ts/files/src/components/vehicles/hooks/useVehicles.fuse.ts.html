import { useIntl } from &#x27;react-intl&#x27;
import { useSelector } from &#x27;react-redux&#x27;
import { RootState } from &#x27;@/store/store&#x27;
import { Vehicle, VehicleTypes, FuelTypes, Vehicles } from &#x27;../types&#x27;

const useVehiclesFuse = (vehicles: Vehicles) =&gt; {
    const intl = useIntl()
    const allDrivers = useSelector((state: RootState) =&gt; state.drivers)
    const fuse: Fuse&lt;Vehicle&gt; = new Fuse(vehicles, {
        keys: [
            &#x27;name&#x27;,
            &#x27;mileage&#x27;,
            &#x27;route&#x27;,
            {
                name: &#x27;drivers&#x27;,
                getFn: (d: Vehicle) =&gt;
                d.drivers ? d.drivers.map((dId) =&gt; {
                        const dr = allDrivers.find((driver) =&gt; driver.key === dId)
                        return `${dr?.name} ${dr?.phone}`
                    }).join(&#x27;, &#x27;) : &#x27;-&#x27;
            },
            {
                name: &#x27;type&#x27;,
                getFn: (t: Vehicle) =&gt;
                    t.type
                        ? intl.formatMessage({
                              id: `app.VehicleType.${
                                  VehicleTypes[
                                      t.type as keyof typeof VehicleTypes
                                  ]
                              }`,
                          })
                        : &#x27;-&#x27;,
            },
            {
                name: &#x27;fuel&#x27;,
                getFn: (t: Vehicle) =&gt;
                    t.fuel
                        ? intl.formatMessage({
                              id: `app.FuelType.${
                                  FuelTypes[
                                      t.fuel as keyof typeof FuelTypes
                                  ]
                              }`,
                          })
                        : &#x27;-&#x27;,
            },
        ],
        shouldSort: true,
        threshold: 0.6,
        location: 0,
        distance: 100,
        minMatchCharLength: 3,
    })

    return { fuse }
}

export default useVehiclesFuse</textarea><pre id="annotations" style="display:none">[]</pre></div>
