    <div style="margin-top:3em" class="ui container"><h1 class="ui header"><a href="../../../../../../../index.html">TypeScript coverage report</a></h1><table style="margin-top:2em" class="ui celled table"><thead class=""><tr class=""><th class="">Filename</th><th class="">Percent</th><th class="">Threshold</th><th class="">Total</th><th class="">Covered</th><th class="">Uncovered</th></tr></thead><tbody class=""><tr class="positive"><td class="">src/components/vehicles/components/VehiclesSelect/views/VehiclesSelectView.tsx</td><td class="">100.00%</td><td class="">80%</td><td class="">198</td><td class="">198</td><td class="">0</td></tr></tbody></table><textarea id="editor" readonly="" style="margin-top:3em">import { useState } from &#x27;react&#x27;
import {
    Box,
    FormControl,
    TextField,
    Autocomplete,
    Button,
} from &#x27;@mui/material&#x27;
import { AddCircle } from &#x27;@mui/icons-material&#x27;
import { createFilterOptions } from &#x27;@mui/material/Autocomplete&#x27;
import { FormattedMessage, useIntl } from &#x27;react-intl&#x27;
import { Vehicle } from &#x27;@/components/vehicles/types&#x27;
import Overflow from &#x27;@/components/common/Overflow/Overflow&#x27;
import { VehiclesSelectProps } from &#x27;../types&#x27;
import { AddVehicle } from &#x27;@/components/vehicles/components/AddVehicle/AddVehicle&#x27;
import { useSelector } from &#x27;react-redux&#x27;
import { RootState } from &#x27;@/store/store&#x27;

const filter = createFilterOptions&lt;Vehicle&gt;()

const VehiclesSelectView = ({
    vehicles,
    setVehicles,
    allVehicles,
    sx,
    multiple,
}: VehiclesSelectProps) =&gt; {
    const intl = useIntl()
    const { settings } = useSelector((state: RootState) =&gt; state.settings)
    const [open, setOpen] = useState&lt;boolean | string&gt;(false)

    return (
        &lt;&gt;
            &lt;FormControl fullWidth variant=&quot;outlined&quot;&gt;
                &lt;Autocomplete
                    id=&quot;vehicles-select&quot;
                    sx={sx}
                    multiple={multiple}
                    options={allVehicles}
                    value={vehicles || []}
                    getOptionLabel={(option) =&gt; option.name || &#x27;&#x27;}
                    onChange={(_, values) =&gt; {
                        if (Array.isArray(values)) {
                            setVehicles(values.map((v) =&gt; v.key))
                        } else if (values?.key) {
                            setVehicles(values.key)
                        } else {
                            setVehicles([])
                        }
                    }}
                    renderOption={(props, option) =&gt; (
                        &lt;li
                            {...props}
                            style={{
                                ...(option.new
                                    ? {
                                          padding: 0,
                                      }
                                    : undefined),
                            }}
                            key={option.key}
                        &gt;
                            {option.new ? (
                                &lt;Box
                                    component=&quot;span&quot;
                                    sx={{
                                        width: &#x27;100%&#x27;,
                                        padding: 1,
                                        paddingLeft: 2,
                                        paddingRight: 2,
                                    }}
                                    onClick={(e) =&gt; {
                                        e.stopPropagation()
                                    }}
                                &gt;
                                    &lt;Button
                                        size=&quot;small&quot;
                                        startIcon={&lt;AddCircle /&gt;}
                                        onClick={(e) =&gt; {
                                            e.stopPropagation()
                                            setOpen(option.name || true)
                                        }}
                                        fullWidth
                                        variant=&quot;outlined&quot;
                                        sx={{
                                            textTransform: &#x27;none&#x27;,
                                        }}
                                    &gt;
                                        &lt;Overflow
                                            text={option.new.toString()}
                                        /&gt;
                                    &lt;/Button&gt;
                                &lt;/Box&gt;
                            ) : (
                                option.name
                            )}
                        &lt;/li&gt;
                    )}
                    filterOptions={(options, params) =&gt; {
                        const filtered = filter(options, params)

                        const { inputValue } = params
                        // Suggest the creation of a new value
                        const isExisting = options.some(
                            (option) =&gt; inputValue === option.name
                        )
                        if (
                            inputValue !== &#x27;&#x27; &amp;&amp;
                            !isExisting &amp;&amp;
                            filtered.length === 0
                        ) {
                            filtered.push({
                                key: &#x27;new&#x27;,
                                name: inputValue,
                                units: settings.units,
                                new: intl.formatMessage(
                                    {
                                        id: &#x27;app.Add[Vehicle]&#x27;,
                                    },
                                    {
                                        vehicle: inputValue,
                                    }
                                ),
                            })
                        } else {
                            filtered.splice(0, 0, {
                                key: &#x27;new&#x27;,
                                name: &#x27;&#x27;,
                                units: settings.units,
                                new: intl.formatMessage({
                                    id: &#x27;app.addVehicle&#x27;,
                                }),
                            })
                        }

                        return filtered
                    }}
                    renderInput={(params) =&gt; (
                        &lt;TextField
                            {...params}
                            label={
                                &lt;FormattedMessage
                                    id={
                                        multiple
                                            ? &#x27;app.Vehicles&#x27;
                                            : &#x27;app.Vehicle&#x27;
                                    }
                                /&gt;
                            }
                        /&gt;
                    )}
                /&gt;
            &lt;/FormControl&gt;
            &lt;AddVehicle
                open={Boolean(open)}
                setOpen={setOpen}
                onSave={(vehicleId) =&gt;
                    setVehicles(
                        Array.isArray(vehicles) &amp;&amp; multiple
                            ? [...vehicles.map((v) =&gt; v.key), vehicleId]
                            : vehicleId
                    )
                }
            /&gt;
        &lt;/&gt;
    )
}

export default VehiclesSelectView
