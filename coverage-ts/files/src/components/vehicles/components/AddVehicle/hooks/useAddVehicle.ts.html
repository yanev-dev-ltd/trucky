import { auth, firestore } from &#x27;@/services/firebase&#x27;
import { useRouter } from &#x27;next/router&#x27;
import { useAddVehicleProps, NewVehicle } from &#x27;../types&#x27;
import { useSelector } from &#x27;react-redux&#x27;
import { RootState } from &#x27;@/store/store&#x27;
import { useSnackbar } from &#x27;notistack&#x27;
import { useIntl } from &#x27;react-intl&#x27;
import { collection, addDoc } from &#x27;firebase/firestore&#x27;

const useAddVehicle = ({onSave, setOpen, open, redirectToEdit}: useAddVehicleProps) =&gt; {
    const intl = useIntl()
    const { settings } = useSelector((state: RootState) =&gt; state.settings)
    const { enqueueSnackbar } = useSnackbar()
    const [newVehicleLoading, setNewVehicleLoading] = useState&lt;boolean&gt;(false)
    const [newVehicle, setNewVehicle] = useState&lt;NewVehicle&gt;({ units: settings.units })
    const router = useRouter()
    const handleAddVehicle = useCallback(() =&gt; {
        if (!auth.currentUser?.uid) return
        setOpen(true)
    },[auth.currentUser?.uid])

    const handleClose = useCallback(() =&gt; {
        setOpen(false)
        setNewVehicleLoading(false)
        setNewVehicle({ units: settings.units || &#x27;km&#x27; })
    },[])

    const changeField = useCallback((field: keyof NewVehicle, value: string) =&gt; {
        setNewVehicle(oldVehicle =&gt; {
            return oldVehicle ? { ...oldVehicle, [field]: value  } : { units: settings.units, [field]: value }
        })
    }, [])

    const addVehicle = async () =&gt; {
        if (!auth.currentUser?.uid || !newVehicle?.name || !newVehicle?.type || !newVehicle?.fuel || !newVehicle?.units) return
        setNewVehicleLoading(true)
        try {
            const refDoc = await addDoc(collection(firestore, &#x27;vehicles&#x27;), { ...newVehicle, userId: auth.currentUser.uid })
            onSave &amp;&amp; refDoc.id &amp;&amp; onSave(refDoc.id)
            handleClose()
            redirectToEdit &amp;&amp; router.push(&#x27;/vehicles/&#x27; + refDoc.id)
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.VehicleAdded&#x27;,
            }), { variant: &#x27;success&#x27; })
        } catch (error) {
            handleClose()
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.Error.AddingVehicle&#x27;,
            }), { variant: &#x27;error&#x27;, persist: true })
        } finally {
            setNewVehicleLoading(false)
        }
    }

    useEffect(() =&gt; {
        function handleKeyPress(event: KeyboardEvent) {
            if (event.key === &#x27;n&#x27; &amp;&amp; event.ctrlKey) {
                event.preventDefault()
                handleAddVehicle()
            }
        }
        document.addEventListener(&#x27;keydown&#x27;,handleKeyPress);
        return () =&gt; document.removeEventListener(&quot;keydown&quot;, handleKeyPress)
    }, [])

    return {
        open,
        handleClose,
        handleAddVehicle,
        changeField,
        addVehicle,
        newVehicle,
        newVehicleLoading,
    }
}
