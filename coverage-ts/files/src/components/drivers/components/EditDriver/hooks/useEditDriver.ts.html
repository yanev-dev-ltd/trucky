    <div style="margin-top:3em" class="ui container"><h1 class="ui header"><a href="../../../../../../../index.html">TypeScript coverage report</a></h1><table style="margin-top:2em" class="ui celled table"><thead class=""><tr class=""><th class="">Filename</th><th class="">Percent</th><th class="">Threshold</th><th class="">Total</th><th class="">Covered</th><th class="">Uncovered</th></tr></thead><tbody class=""><tr class="positive"><td class="">src/components/drivers/components/EditDriver/hooks/useEditDriver.ts</td><td class="">100.00%</td><td class="">80%</td><td class="">151</td><td class="">151</td><td class="">0</td></tr></tbody></table><textarea id="editor" readonly="" style="margin-top:3em">import { useState, useEffect, useCallback } from &#x27;react&#x27;
import { useEditDriverProps, EditDriverProps } from &#x27;../types&#x27;
import { Driver } from &#x27;@/components/drivers/types&#x27;
import { useRouter } from &#x27;next/router&#x27;
import { useIntl } from &#x27;react-intl&#x27;
import { useSnackbar } from &#x27;notistack&#x27;
import { firestore, auth } from &#x27;@/services/firebase&#x27;
import useFiles from &#x27;@/hooks/useFiles&#x27;
import { collection, updateDoc, doc, where, query, onSnapshot } from &#x27;firebase/firestore&#x27;
import { Group } from &#x27;@/components/common/Group/types&#x27;
import { setGroups } from &#x27;@/components/common/Group/redux&#x27;
import { useDispatch } from &#x27;react-redux&#x27;

const useEditDriver = ({ driver, edit }: useEditDriverProps) : EditDriverProps =&gt; {
    const [editedDriver, setEditedDriver] = useState&lt;Driver | undefined&gt;(driver)
    const router = useRouter()
    const intl = useIntl()
    const dispatch = useDispatch()
    const { enqueueSnackbar } = useSnackbar()
    const { downloadFile, deleteFile } = useFiles()
    useEffect(() =&gt; setEditedDriver(driver), [driver])

    useEffect(() =&gt; {
        if (!auth.currentUser?.uid || !driver?.key) {
            return
        }
        const qg = query(collection(firestore, &#x27;groups&#x27;), where(&#x27;userId&#x27;, &#x27;==&#x27;, auth.currentUser?.uid), where(&#x27;type&#x27;, &#x27;==&#x27;, &#x27;driver&#x27;))
        const unsubscribeGroups = onSnapshot(qg, (querySnapshot) =&gt; {
            const groups: Group[] = []
            querySnapshot.forEach((doc) =&gt; {
                groups.push({key: doc.id, ...doc.data()})
            })
            dispatch(setGroups(groups))
        }, (error) =&gt; enqueueSnackbar(error.message, { variant: &#x27;error&#x27;, persist: true }))
        return () =&gt; {
            unsubscribeGroups()
        }
    }, [auth.currentUser?.uid, driver?.key])

    const saveDriverField = useCallback(async (field: keyof Driver) =&gt; {
        if (!driver?.key || !auth?.currentUser?.uid) return
        try {
            await updateDoc(doc(firestore, &#x27;drivers&#x27;, driver.key), { [field]: editedDriver?.[field]})
            enqueueSnackbar(intl.formatMessage({
                id: `app.Saved.${field}`,
            }), { variant: &#x27;success&#x27; })
        } catch (error) {
            enqueueSnackbar(intl.formatMessage({
                id: &#x27;app.Error.saving&#x27;,
            }), { variant: &#x27;error&#x27;, persist: true })
        }
        router.push(&#x27;/drivers/&#x27; + driver.key)
    }, [editedDriver])

    const reset = useCallback(() =&gt; {
        setEditedDriver(driver)
    }, [setEditedDriver, driver])

    const deleteDriver = useCallback(() =&gt; {
        console.log(&#x27;delete driver: &#x27;,driver.key)
        // TODO: set driver as deleted with db flag
    }, [driver?.key])
    return {
        driver,
        edit,
        reset,
        saveDriverField,
        setEditedDriver,
        editedDriver,
        downloadFile,
        deleteFile,
        deleteDriver
    }
}

export default useEditDriver</textarea><pre id="annotations" style="display:none">[]</pre></div>
